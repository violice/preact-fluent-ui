name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - run: npm run licenses:check
      - run: npm run build
      - run: npm run build:gallery
      # All builds finish before this command packs once and verifies the locked peer.
      - run: npm run test:package
      - name: Verify the same archive with the minimum peer
        run: npm run test:package -- --tarball "$GITHUB_WORKSPACE/.artifacts/package/violice-preact-fluent-ui-0.1.0.tgz" --preact 10.27.0
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-evidence
          path: .artifacts/package/
          include-hidden-files: true
          if-no-files-found: error
